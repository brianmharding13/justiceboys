<!doctype html>
<html lang="en" class="bg-ink">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JUSTICE BOYS</title>
    <meta name="description" content="" />
    <meta name="robots" content="noarchive" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050506'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='20' font-weight='bold' text-anchor='middle' fill='%23e8e6e1'%3EJ%3C/text%3E%3C/svg%3E" />
  </head>

  <body class="min-h-screen bg-ink font-mono text-bone antialiased selection:bg-bone selection:text-ink">
    <!-- scanline overlay -->
    <div class="pointer-events-none fixed inset-0 z-50 opacity-[0.18] mix-blend-overlay [background:repeating-linear-gradient(0deg,rgba(255,255,255,.6)_0px,rgba(255,255,255,.6)_1px,transparent_1px,transparent_3px)]"></div>
    <div class="pointer-events-none fixed inset-x-0 top-0 z-50 h-24 animate-scan bg-gradient-to-b from-transparent via-white/[0.04] to-transparent"></div>

    <div class="relative mx-auto flex min-h-screen max-w-6xl flex-col px-4 py-6 sm:px-6 lg:px-8">
      <!-- ── header ───────────────────────────────────────── -->
      <header class="mb-8 border-b border-edge pb-6">
        <div class="flex flex-wrap items-end justify-between gap-x-8 gap-y-5">
          <h1 class="animate-flicker text-4xl font-bold uppercase leading-none tracking-tight sm:text-6xl">
            Justice<span class="text-ash">Boys</span>
          </h1>

          <!-- case file — number stays redacted until touched -->
          <p class="text-[11px] uppercase tracking-[0.2em] text-steel">
            Case Number: <span class="redact" tabindex="0">#42069</span>
          </p>
        </div>
      </header>

      <!-- ── player + playlist ────────────────────────────── -->
      <main class="grid flex-1 gap-8 lg:grid-cols-[minmax(0,1fr)_20rem]">
        <!-- stage -->
        <section class="flex flex-col items-center">
          <div class="w-full max-w-[380px]">
            <!-- 9:16 portrait frame -->
            <div class="relative aspect-[9/16] w-full overflow-hidden border border-edge bg-black shadow-[0_0_70px_-18px_rgba(154,154,162,0.32)]">
              <div id="player" class="absolute inset-0 h-full w-full"></div>
            </div>

            <!-- transport -->
            <div class="mt-3 flex items-center justify-between gap-3 border border-edge bg-panel px-3 py-2">
              <button
                id="prev"
                type="button"
                class="px-2 py-1 text-xs uppercase tracking-widest text-ash transition hover:text-bone focus:outline-none focus-visible:ring-1 focus-visible:ring-steel"
              >
                ◄ prev
              </button>
              <p id="now-playing" class="min-w-0 flex-1 truncate text-center text-[11px] uppercase tracking-widest text-bone">
                standby
              </p>
              <button
                id="next"
                type="button"
                class="px-2 py-1 text-xs uppercase tracking-widest text-ash transition hover:text-bone focus:outline-none focus-visible:ring-1 focus-visible:ring-steel"
              >
                next ►
              </button>
            </div>

            <p class="mt-2 text-center text-[10px] uppercase tracking-widest text-ash">
              plays in order · advances on its own
            </p>
          </div>
        </section>

        <!-- playlist -->
        <aside class="lg:sticky lg:top-6 lg:self-start">
          <h2 class="mb-3 flex items-baseline justify-between text-[10px] uppercase tracking-[0.35em] text-steel">
            <span>the dossier</span>
            <span id="file-count" class="text-ash"></span>
          </h2>
          <ol id="playlist" class="divide-y divide-edge border border-edge bg-panel"></ol>
        </aside>
      </main>

      <!-- ── footer ───────────────────────────────────────── -->
      <footer class="mt-10 border-t border-edge pt-4 text-[10px] uppercase tracking-widest text-ash">
        <p>no cookies · no accounts · no names</p>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
